<style>

<body>
<div id="frame">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><canvas id="grain" width="960" height="540"></canvas></div>
  <div id="scenes"></div>
</div>
<div id="hint">Espacio: pausa · ← →: ±2 s · R: reiniciar · ?plan=inicio | negocio | pro</div>
<script>
/* ============================================================================
 * Video de casos de uso de Kopa Caffe. Una sola línea de tiempo (Web Animations API) que

 * Cada movimiento importante registra un efecto de sonido (`sfx`) en su segundo exacto y cada

 * Movimiento "Premium" de la marca: entrada (0.22, 0.61, 0.36, 1) ~0.95 s, salida que acelera (0.55 s),
 * cámara suave ~1.2 s; capas: primaria (tarjetas), secundaria (conectores, punto viajero, scroll de capturas),

const params = new URLSearchParams(location.search);

const DIM = {};
const IMG = (f) => (f.startsWith('shared/') ? `assets/${f}` : `assets/${PLAN.id}/${f}`);

function card(n, at, note = 0, o = {}) { enter(n, at, { y: 36, s: 0.97, ...o }); sfx('pop', at + 0.04, { note, gain: o.gain ?? 0.8 }); }
/* título palabra a palabra; *texto* = destacado en cursiva rosa */
function words(parent, text, at, o = {}) {
  const { step = 0.07, dur = 0.95, sound = true } = o;
  let acc = false, i = 0;
  for (const raw of text.split(' ')) {
    // "*web*." → parte destacada "web" + resto "." sin destacar

}
/* pincelada: se "pinta" de izquierda a derecha */

}
const ICON = {
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>',
  team: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="17" cy="9" r="2.8"/><path d="M15.5 13.8c3.2.2 5.8 2.8 6 6.2"/>',
  admin: '<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/>',
  shield: '<path d="M12 3l8 3v6c0 4.4-3.4 8.2-8 9-4.6-.8-8-4.6-8-9V6l8-3z"/><path d="M8.5 12l2.4 2.4 4.6-4.8"/>',
  code: '<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  bike: '<circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>',
};
const actorIcon = (role) => /cliente/i.test(role) ? 'user' : /equipo|personal/i.test(role) ? 'team' : /sistema/i.test(role) ? 'shield' : /cdj/i.test(role) ? 'code' : /motorizado/i.test(role) ? 'bike' : 'admin';

/* conector discontinuo que se dibuja (máscara) + punta + punto viajero */
let MID = 0;
function linksLayer(parent, w = 4000) { return el(`<svg class="links" width="${w}" height="1080" viewBox="0 0 ${w} 1080"><defs></defs></svg>`, parent); }
function link(parent, svg, d, at, dur, o = {}) {

  mask.setAttribute('x', '-200'); mask.setAttribute('y', '-200'); mask.setAttribute('width', String(Number(svg.getAttribute('width')) + 400)); mask.setAttribute('height', '1500');

  // indicador de pasos
  const st = el('<div class="stepper"><div class="rail"></div><div class="fill"></div></div>', sc);
  enter(st, T0 + 0.8, { y: 16, dur: 0.8 });
  const sw = 1320, k = nodes.length - 1;
  nodes.forEach((n, i) => {
    const s_ = pos(el(`<div class="s"><b></b>${esc(n.label)}</div>`, st), { left: (sw / k) * i });
    const b = s_.querySelector('b'), at = T0 + n.t + 0.35;
    A(b, [{ background: '#fbf6f1', borderColor: 'rgba(28,27,26,0.22)', transform: 'scale(1)' }, { background: '#cf7c79', borderColor: '#a63f45', transform: 'scale(1.25)' }], at, 0.6, E.enter, 'forwards');
    A(s_, [{ color: 'rgba(76,71,67,0.55)' }, { color: '#1c1b1a' }], at, 0.5, E.sig, 'forwards');
    if (i < k) {
      A(b, [{ transform: 'scale(1.25)', background: '#cf7c79' }, { transform: 'scale(1)', background: '#f1cfcb' }], T0 + nodes[i + 1].t + 0.35, 0.6, E.inout, 'forwards');
      A(s_, [{ color: '#1c1b1a' }, { color: 'rgba(76,71,67,0.85)' }], T0 + nodes[i + 1].t + 0.35, 0.5, E.sig, 'forwards');
      A(st.querySelector('.fill'), [{ transform: `scaleX(${i / k})` }, { transform: `scaleX(${(i + 1) / k})` }], T0 + nodes[i + 1].t + 0.35, 1.0, E.inout, 'forwards');
    }
  });
  return D;
};

B.chains = (T0, s) => {
  const nR = s.rows.length;
  const RH = nR === 1 ? 300 : nR === 2 ? 270 : 200, Y0 = nR === 1 ? 420 : nR === 2 ? 320 : 270, GAPY = nR === 3 ? 62 : 90;
  const AW = 74;
  let t = 1.4, totalWords = wc(s.title);
  const plan = s.rows.map((r, ri) => {
    const items = r.items.map((it) => {
      let w = 0;
      if (it.kind === 'shot') { const [iw, ih] = DIM[IMG(it.img)] || [1000, 625]; w = Math.max(nR === 3 ? 400 : 260, Math.min(470, (RH - 50) * iw / ih)); }
      else if (it.kind === 'list') w = 450; else if (it.kind === 'bubble') w = 430; else if (it.kind === 'sheet') w = 470; else w = 300;
      totalWords += wc(it.caption || it.title || it.text || '') + (it.items ? wc(it.items.join(' ')) : 0);
      return { ...it, w };
    });
    const tw = items.reduce((a, x) => a + x.w, 0) + AW * (items.length - 1);
    const k = tw > 1620 ? (1620 - AW * (items.length - 1)) / (tw - AW * (items.length - 1)) : 1;
    items.forEach((it) => { it.w *= k; });
    const row = { ...r, items, y: Y0 + ri * (RH + GAPY), t };
    t += 0.5 + items.length * 0.55;
    return row;
  });
  const D = Math.max(t + 2.6, 2.0 + totalWords / 6);
  const sc = scene(T0, D, 'chains');
  header(sc, T0, s.eyebrow, s.title);
  const svg = linksLayer(sc);
  plan.forEach((r, ri) => {
    const at0 = T0 + r.t;
    const lb = brush(sc, r.label, ri % 2 ? 'sage' : '', at0, { sm: true }); pos(lb, { left: 150, top: r.y - 44 });
    let x = 150;
    r.items.forEach((it, k) => {
      const at = at0 + 0.35 + k * 0.55;
      let html;
      if (it.kind === 'shot') { const sh = shotHTML(it.img, it.w, RH - 50); html = `<div class="item" style="width:${it.w}px;height:${RH}px">${sh.html}<div class="cap">${esc(it.caption)}</div></div>`; }
      else if (it.kind === 'list') html = `<div class="item list" style="width:${it.w}px;height:${RH}px"><h4>${esc(it.title)}</h4><ul>${it.items.map((li) => `<li>${esc(li)}</li>`).join('')}</ul></div>`;
      else if (it.kind === 'bubble') html = `<div class="item bub" style="width:${it.w}px;height:${RH}px"><div class="bubble">${esc(it.text)}</div></div>`;
      else if (it.kind === 'sheet') html = `<div class="item sheet" style="width:${it.w}px;height:${RH}px"><div class="bar">Hoja de Google · carta</div><table><tr><th>nombre</th><th>precio</th><th>categoría</th></tr>${it.rows.map((row, ri2) => `<tr>${row.map((c, ci) => `<td class="${it.hl && it.hl[0] === ri2 && it.hl[1] === ci ? 'hl' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table><div class="cap" style="position:absolute;bottom:0">${esc(it.caption)}</div></div>`;
      else html = `<div class="item end" style="width:${it.w}px;height:${RH}px">${esc(it.text)}</div>`;
      const n = pos(el(html, sc), { left: x, top: r.y });
      card(n, at, (ri * 2 + k) % 8, { gain: 0.75 });
      if (it.kind === 'bubble') sfx('send', at + 0.35, { gain: 0.8 });
      if (it.kind === 'end') sfx('chime', at + 0.3, { note: 5 + (k % 3), gain: 0.5 });
      if (it.sound) sfx(it.sound, at + 0.4, { gain: 0.9 });
      if (it.kind === 'list') n.querySelectorAll('li').forEach((li, j) => { enter(li, at + 0.4 + j * 0.18, { y: 8, x: -8, dur: 0.6 }); sfx('tick', at + 0.45 + j * 0.18, { gain: 0.5 }); });
      if (it.kind === 'sheet') { const hl = n.querySelector('.hl'); if (hl) { A(hl, [{ boxShadow: 'inset 0 0 0 0 #cf7c79' }, { boxShadow: 'inset 0 0 0 3px #cf7c79' }], at + 0.8, 0.6, E.sig); sfx('tap', at + 0.85, { gain: 0.6 }); } }
      if (k > 0) link(sc, svg, `M ${x - AW + 12} ${r.y + RH / 2} L ${x - 14} ${r.y + RH / 2}`, at - 0.32, 0.45, { end: [x - 14, r.y + RH / 2], gain: 0.3 });
      x += it.w + AW;
    });
  });
  return D;
};

B.phones = (T0, s) => {
  const n = s.phones.length, PW = n > 4 ? 218 : 262, imgW = PW - 16;
  const [iw, ih] = DIM[IMG(s.phones[0].img)] || [400, 866];
  const PH = imgW * ih / iw + 16, gap = (1620 - n * PW) / (n - 1), Y = 268;
  const D = Math.max(8, 2.2 + n * 0.6 + 2.6);
  const sc = scene(T0, D, 'phones');
  header(sc, T0, s.eyebrow, s.title);
  const svg = linksLayer(sc);
  s.phones.forEach((p, i) => {
    const x = 150 + i * (PW + gap), at = T0 + 1.3 + i * 0.5;
    const ph = pos(el(`<div class="phone" style="width:${PW}px"><img src="${IMG(p.img)}" /></div>`, sc), { left: x, top: Y });
    card(ph, at, i + 1, { y: 50 });
    A(ph, [{ translate: '0 0' }, { translate: '0 -8px' }], at + 1.0 + i * 0.2, 3.2, E.sine, 'none', { iterations: Infinity, direction: 'alternate' });
    const c = pos(el(`<div class="pcap" style="width:${PW + 40}px">${esc(p.title)}<small>${esc(p.text)}</small></div>`, sc), { left: x - 20, top: Y + PH + 28 });
    enter(c, at + 0.3, { y: 14, dur: 0.8 });
    if (i < n - 1) link(sc, svg, `M ${x + PW + 18} ${Y + PH / 2} L ${x + PW + gap - 18} ${Y + PH / 2}`, at + 0.35, 0.4, { end: [x + PW + gap - 18, Y + PH / 2], gain: 0.25 });
  });
  return D;
};

const GROUPC = ['var(--rose)', 'var(--sage)', 'var(--ink)', 'var(--rose-deep)'];
const GROUPT = ['var(--rose-deep)', 'var(--sage-deep)', 'var(--ink)', 'var(--rose-deep)'];
B.cases = (T0, s) => {
  const all = []; s.groups.forEach((g, gi) => g.items.forEach(([code, tt]) => all.push({ code, tt, gi })));
  const n = all.length, cols = n > 12 ? 6 : 4, rows = Math.ceil(n / cols);
  // con 5 filas (más de 24 casos) las tarjetas se achican para que todo quepa bajo el título
  const GX = 22, GY = rows > 4 ? 16 : 22, CWc = (1620 - GX * (cols - 1)) / cols, CHc = rows > 4 ? 104 : n > 12 ? 128 : n > 8 ? 136 : 168;
  const Y0 = Math.round(290 + (600 - rows * (CHc + GY)) / 2);
  const D = Math.max(9, 2.4 + n * 0.08 + 4.2 + n * 0.12);
  const sc = scene(T0, D, 'cases');
  header(sc, T0, s.eyebrow, s.title);
  const lg = pos(el(`<div class="legend">${s.groups.map((g, gi) => `<span><i style="background:${GROUPC[gi]}"></i>${esc(g.label)} (${g.items.length})</span>`).join('')}</div>`, sc), { left: 150, top: Y0 + rows * (CHc + GY) + 18 });
  enter(lg, T0 + 1.6, { y: 10, dur: 0.7 });
  all.forEach((c, i) => {
    const r = Math.floor(i / cols), k = i % cols;
    const small = rows > 4;
    const n_ = pos(el(`<div class="cu" style="width:${CWc}px;height:${CHc}px${small ? ';padding:14px 18px' : ''}"><div class="bar" style="background:${GROUPC[c.gi]}"></div><div class="code" style="color:${GROUPT[c.gi]}">${c.code}</div><div class="tt" style="font-size:${small ? 20 : n > 12 ? 22 : 25}px${small ? ';margin-top:7px' : ''}">${esc(c.tt)}</div></div>`, sc), { left: 150 + k * (CWc + GX), top: Y0 + r * (CHc + GY) });
    const at = T0 + 1.2 + (r + k) * 0.09 + i * 0.015;
    enter(n_, at, { y: 26, s: 0.96, dur: 0.8 });
    sfx('pop', at + 0.03, { note: (r + k) % 9, gain: 0.45 });
  });
  return D;
};

B.special = (T0, s) => {
  // más de 10 casos: 4 columnas y 3 filas más bajas
  const n = s.items.length, cols = n > 10 ? 4 : Math.min(5, n), rows = Math.ceil(n / cols);
  const GX = 24, CWc = (1620 - GX * (cols - 1)) / cols, CHc = rows > 2 ? 206 : rows > 1 ? 244 : 340, Y0 = rows > 2 ? 270 : rows > 1 ? 320 : 380;
  const D = Math.max(9, 2.6 + n * 0.25 + s.items.reduce((a, x) => a + wc(x.title + ' ' + x.text), 0) / 6.5);
  const sc = scene(T0, D, 'special');
  header(sc, T0, s.eyebrow, s.title);
  s.items.forEach((it, i) => {
    const r = Math.floor(i / cols), k = i % cols;
    const c = pos(el(`<div class="card" style="width:${CWc}px;height:${CHc}px;padding:28px 26px"><div style="height:36px;position:relative"></div><h3 style="margin-top:16px;font-size:${rows > 1 ? 27 : 30}px">${esc(it.title)}</h3><p class="t" style="margin-top:10px;font-size:${rows > 1 ? 20 : 23}px">${rich(it.text)}</p></div>`, sc), { left: 150 + k * (CWc + GX), top: Y0 + r * (CHc + 26) });
    const at = T0 + 1.3 + i * 0.22;
    card(c, at, i % 9, { gain: 0.6 });
    const b = brush(c, it.code, i % 2 ? 'sage' : '', at + 0.35, { sound: false, sm: true }); pos(b, { left: 24, top: 26 });
  });
  return D;
};

B.roadmap = (T0, s) => {
  const n = s.stages.length, GX = 70, SW = (1620 - GX * (n - 1)) / n, SH = n > 3 ? 410 : 330, Y = n > 3 ? 330 : 360;
  const D = Math.max(9.5, 2.8 + n * 0.6 + s.stages.reduce((a, x) => a + wc(x.title + ' ' + x.text), 0) / 6);
  const sc = scene(T0, D, 'roadmap');
  header(sc, T0, s.eyebrow, s.title);
  const svg = linksLayer(sc);
  s.stages.forEach((st, i) => {
    const x = 150 + i * (SW + GX), at = T0 + 1.3 + i * 0.6;
    const c = pos(el(`<div class="stage ${st.today ? 'today' : ''}" style="width:${SW}px;height:${SH}px"><div style="height:36px;position:relative"></div><h3 style="font-size:${n > 3 ? 26 : 30}px">${esc(st.title)}</h3><p style="font-size:${n > 3 ? 20 : 23}px">${rich(st.text)}</p>${st.tag ? `<div class="tagreq">${esc(st.tag)}</div>` : ''}</div>`, sc), { left: x, top: Y });
    card(c, at, i * 2, { gain: 0.7 });
    const b = brush(c, st.label, st.today ? '' : 'sage', at + 0.35, { sound: false, sm: n > 3 }); pos(b, { left: 24, top: 24 });
    if (st.today) { sfx('chime', at + 0.5, { note: 2, gain: 0.6 }); scribble(sc, 'Tu web hoy ♡', at + 0.8, 'scribble').style.cssText += `left:${x + 10}px;top:${Y + SH + 26}px;font-size:40px`; }
    if (i > 0) link(sc, svg, `M ${x - GX + 12} ${Y + SH / 2} L ${x - 14} ${Y + SH / 2}`, at - 0.35, 0.45, { end: [x - 14, Y + SH / 2], gain: 0.3 });
  });
  return D;
};

B.outro = (T0, s) => {
  const D = 7.6, sc = scene(T0, D, 'outro');
  const logo = pos(el('<img class="abs" src="assets/shared/kopa-logo-ink.png" style="height:300px" />', sc), { left: 960 - 84, top: 160 });
  A(logo, [{ opacity: 0, transform: 'scale(0.9)' }, { opacity: 1, transform: 'none' }], T0 + 0.4, 1.2, E.enter);
  sfx('success', T0 + 0.5, { gain: 0.9 });
  const sb = scribble(sc, s.scribble, T0 + 1.6); pos(sb, { left: 0, top: 520, width: '1920px', textAlign: 'center' });
  const ln = pos(el(`<div class="lede" style="width:1920px;text-align:center;font-size:26px">${esc(s.line)}</div>`, sc), { left: 0, top: 640 });
  enter(ln, T0 + 2.8, { y: 14 });
  const cr = pos(el(`<div class="abs" style="width:1920px;text-align:center"><span class="brushw"><span class="brush ink sm">${esc(s.credit)}</span></span></div>`, sc), { left: 0, top: 760 });
  A(cr.firstChild, [{ clipPath: 'inset(-20% 100% -20% 0)' }, { clipPath: 'inset(-20% -2% -20% 0)' }], T0 + 3.4, 0.7, E.write);
  sfx('swish', T0 + 3.4, { gain: 0.5 });
  return D;
};

/* ======================================================================= FONDO (capa ambiental) */
(function ambient() {
  const o = { iterations: Infinity, direction: 'alternate' };
  A(document.querySelector('.b1'), [{ transform: 'scale(1)', opacity: 0.85 }, { transform: 'scale(1.1) translate(-30px, 20px)', opacity: 1 }], 0, 13, E.sine, 'both', o);
  A(document.querySelector('.b2'), [{ transform: 'scale(1)', opacity: 0.85 }, { transform: 'scale(1.12) translate(30px, -20px)', opacity: 1 }], -5, 16, E.sine, 'both', o);
  A(document.querySelector('.b3'), [{ transform: 'scale(1)', opacity: 0.6 }, { transform: 'scale(1.2)', opacity: 1 }], -3, 11, E.sine, 'both', o);
  // grano de papel (estático)
  const c = document.getElementById('grain'), g = c.getContext('2d'), d = g.createImageData(c.width, c.height);
  let s = 7; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < d.data.length; i += 4) { const v = 200 + r() * 55; d.data[i] = v; d.data[i + 1] = v * 0.97; d.data[i + 2] = v * 0.94; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); c.style.width = '1920px'; c.style.height = '1080px';
})();

/* ======================================================================= MONTAJE */
let TOTAL = 0;
function seek(t) { t = Math.max(0, Math.min(TOTAL, t)); for (const a of anims) a.currentTime = t * 1000; }
function build() {
  let T = 0;
  PLAN.scenes.forEach((s) => { const d = B[s.type](T, s); T += d - 0.35; });
  TOTAL = T + 0.35 + 0.6;
  window.__seek = seek; window.__duration = TOTAL; window.__cues = cues.sort((a, b) => a.at - b.at);
}
async function preload() {
  const files = new Set();
  PLAN.scenes.forEach((s) => {
    if (s.photo) files.add(IMG(s.photo));
    (s.nodes || []).forEach((n) => { if (n.img) files.add(IMG(n.img)); (n.options || []).forEach((o) => o.img && files.add(IMG(o.img))); });
    (s.type === 'chains' ? s.rows : []).forEach((r) => r.items.forEach((it) => it.img && files.add(IMG(it.img))));
    (s.phones || []).forEach((p) => files.add(IMG(p.img)));
  });
  await Promise.all([...files].map((f) => new Promise((res) => { const im = new Image(); im.onload = () => { DIM[f] = [im.naturalWidth, im.naturalHeight]; EDGE[f] = edges(im); res(); }; im.onerror = () => res(); im.src = f; })));
}
// color medio de la franja superior e inferior de una captura (para rellenar si no llena el recuadro)
const EDGE = {};
function edges(im) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0, 64, 64);
  const avg = (y) => { const d = g.getImageData(0, y, 64, 2).data; let r = 0, gg = 0, b = 0; for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; } const n = d.length / 4; return `rgb(${Math.round(r / n)},${Math.round(gg / n)},${Math.round(b / n)})`; };
  return [avg(0), avg(62)];
}

const RENDER = params.has('render');
const frame = document.getElementById('frame');
function fit() { if (RENDER) return; const s = Math.min(innerWidth / 1920, innerHeight / 1080); frame.style.transform = `scale(${s})`; frame.style.left = (innerWidth - 1920 * s) / 2 + 'px'; frame.style.top = (innerHeight - 1080 * s) / 2 + 'px'; }
fit(); addEventListener('resize', fit);
if (RENDER) document.getElementById('hint').remove();
document.title = `Casos de uso · Kopa Caffe · ${PLAN.title}`;

preload().then(() => { build(); return Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]); }).then(() => {
  seek(0);
  window.__ready = true;
  if (!RENDER) {
    let playing = true, base = parseFloat(params.get('t') || '0'), t0 = performance.now();
    const cur = () => (playing ? base + (performance.now() - t0) / 1000 : base);
    const loop = () => { let t = cur(); if (t > TOTAL) { base = 0; t0 = performance.now(); t = 0; } seek(t); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); if (playing) { base = cur(); playing = false; } else { t0 = performance.now(); playing = true; } }
      if (e.code === 'ArrowRight') { base = Math.min(TOTAL, cur() + 2); t0 = performance.now(); }
      if (e.code === 'ArrowLeft') { base = Math.max(0, cur() - 2); t0 = performance.now(); }
      if (e.key === 'r' || e.key === 'R') { base = 0; t0 = performance.now(); playing = true; }
    });
  }
});
</script>
